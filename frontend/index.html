<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mini-blockchain con ECDSA sobre secp256k1 y el ataque por nonce repetido" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>minichain</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo.
      try {
        var t = localStorage.getItem("minichain-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
